{% extends "base.html" %}
{% block title %}KidsProxy — Log in{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:4rem auto">
  <h2 style="margin-top:0">Parent login</h2>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Password</label>
    <input type="password" name="password" autofocus required style="width:100%">
    <p><button type="submit">Log in</button></p>
  </form>
</div>
{% endblock %}
